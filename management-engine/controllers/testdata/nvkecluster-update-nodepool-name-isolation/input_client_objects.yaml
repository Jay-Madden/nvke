apiVersion: v1
kind: ConfigMap
metadata:
  name: infra-template
  namespace: default
data:
  clusterTmpl: |
    {
      "cluster": {
        "apiVersion": "infrastructure.cluster.x-k8s.io/v1beta2",
        "kind": "DockerCluster",
        "metadata": {
          "labels": {
            "site-id": "{{ .SiteID }}",
            "vpc-id": "{{ .VPCID }}"
          }
        },
        "spec": {}
      }
    }
  nodepoolTmpl: |
    {
      "machineTemplate": {
        "apiVersion": "infrastructure.cluster.x-k8s.io/v1beta2",
        "kind": "DockerMachineTemplate",
        "spec": {
          "template": {
            "metadata": {
              "annotations": {
                "cluster.x-k8s.io/paused": "true"
              },
              "labels": {
                "site-id": "{{ .SiteID }}",
                "vpc-id": "{{ .VPCID }}",
                "instance-type": "{{ .InstanceType }}",
                "vpc-prefix-id": "{{ .VPCPrefixID }}",
                "ssh-key-group-id": "{{ .SSHKeyGroupID }}"
              }
            },
            "spec": {}
          }
        }
      }
    }
---
apiVersion: internal.nvke.nvidia.com/v1
kind: NVKECluster
metadata:
  name: cluster-1
  namespace: default
spec:
  apiServerAccess:
    publicAccessEnabled: false
  clusterNetwork:
    pods:
      cidrBlocks: [10.244.0.0/16]
    services:
      cidrBlocks: [10.96.0.0/12]
    serviceDomain: cluster.local
  release:
    channel:
      name: stable
  controlPlaneClass: standard
  siteID: 11111111-1111-4111-8111-111111111111
  network:
    vpcID: 22222222-2222-4222-8222-222222222222
  nodePools:
    - name: workers
      instanceType: 33333333-3333-4333-8333-333333333333
      replicas: 1
      vpcSubnetID: 44444444-4444-4444-8444-444444444444
      nodeProfile: "example:1.36.1"
      vpcPrefixID: 55555555-5555-4555-8555-555555555555
      sshKeyGroupID: 66666666-6666-4666-8666-666666666666
